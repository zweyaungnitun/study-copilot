# Non-secret settings for Cloud Run. Copy to deploy/env.yaml (gitignored) and fill in.
# Secrets (DATABASE_URL, SECRET_KEY, GOOGLE_API_KEY, S3 keys) go in Secret Manager; see deploy/gcp.sh.
APP_ENV: production
DEBUG: "false"
ADMIN_USERNAMES: '["your-admin-username"]'

# Ingestion runs inside the API instance (no Redis). Needs --no-cpu-throttling and --max-instances 1.
INGEST_MODE: background
OCR_PROVIDER: gemini

# Neon Postgres holds both the app tables and the pgvector index
VECTOR_BACKEND: pgvector

# Uploads in Google Cloud Storage through its S3-compatible API (HMAC keys)
STORAGE_BACKEND: s3
S3_ENDPOINT_URL: https://storage.googleapis.com
S3_REGION: auto
S3_BUCKET: your-bucket-name
